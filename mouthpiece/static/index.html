<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOUTHPIECE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0b; --surface:#131313; --surface2:#1a1a1a;
  --border:#222; --border2:#2e2e2e; --border3:#3a3a3a;
  --text:#ccc; --muted:#555; --dim:#2a2a2a;
  --accent:#c4a84e; --accent-dim:rgba(196,168,78,.12);
  --blue:#6a7fc4;
  --green:#3d8a52; --yellow:#8a8330; --red:#8a3535;
  --missing-bg:#180e0e; --locked-bg:#0d160d;
  --player-h:56px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Courier New',Courier,monospace;font-size:12px;
  display:flex;flex-direction:column;
  padding-bottom:var(--player-h);overflow:hidden;
}

/* header */
header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:9px;letter-spacing:.55em;color:var(--accent);text-transform:uppercase}
#status{font-size:9px;color:var(--muted);letter-spacing:.06em;min-width:200px;text-align:right}

/* input */
.input-row{display:flex;gap:8px;padding:12px 28px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.text-input{flex:1;background:transparent;border:none;
  border-bottom:1px solid var(--border2);
  color:var(--text);font-family:inherit;font-size:14px;
  padding:6px 2px;outline:none;transition:border-color .15s}
.text-input:focus{border-color:var(--accent)}
.text-input::placeholder{color:var(--dim)}
.seed-input{width:88px;background:transparent;border:none;
  border-bottom:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:11px;padding:6px 2px;
  outline:none;text-align:center}
.seed-input::placeholder{color:var(--dim)}
.btn{background:transparent;border:1px solid var(--border2);
  color:var(--text);font-family:inherit;font-size:9px;
  letter-spacing:.2em;padding:6px 16px;cursor:pointer;
  transition:border-color .12s,color .12s,background .12s;
  white-space:nowrap;text-transform:uppercase}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{background:var(--accent);color:#000}
.btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}

/* info */
#infoBar{display:none;padding:0 28px;border-bottom:1px solid var(--border);flex-shrink:0}
#infoBar.visible{display:flex;align-items:center;gap:0}
.info-cell{font-size:9px;color:var(--muted);
  padding:7px 20px 7px 0;letter-spacing:.06em}
.info-cell b{color:var(--text);font-weight:normal}
.info-cell:not(:last-child){border-right:1px solid var(--border);margin-right:20px}

/* word canvas */
#canvas{flex:1;overflow-y:auto;padding:24px 28px 16px;min-height:0}
#strip{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-end}
.empty-state{color:var(--muted);font-size:10px;letter-spacing:.12em;padding:16px 0}

/* tile */
.tile{position:relative;display:inline-flex;flex-direction:column;gap:4px;
  padding:11px 13px 9px;
  background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--dim);
  cursor:pointer;flex-shrink:0;min-width:60px;
  transform:rotate(var(--tilt,0deg));
  transition:transform .13s,border-color .13s,box-shadow .13s,background .13s;
  user-select:none}
.tile:hover{background:var(--surface2);border-color:var(--border3);
  transform:rotate(0deg) translateY(-4px);
  box-shadow:0 8px 24px rgba(0,0,0,.7);z-index:10}
.tile.selected{background:var(--surface2);border-color:var(--accent)!important;
  transform:rotate(0deg) translateY(-4px);
  box-shadow:0 8px 24px rgba(0,0,0,.7),0 0 0 1px var(--accent-dim);z-index:10}
.tile.t-playing{
  box-shadow:0 0 0 1px rgba(196,168,78,.35),0 0 14px rgba(196,168,78,.12)!important;
  border-color:rgba(196,168,78,.3)!important}
.tile.missing{background:var(--missing-bg);border-left-color:var(--red);opacity:.6}
.tile.t-locked{background:var(--locked-bg)}
.tile.t-adj::after{content:'';position:absolute;bottom:3px;right:3px;
  width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.7}
.cf-hi{border-left-color:var(--green)!important}
.cf-md{border-left-color:var(--yellow)!important}
.cf-lo{border-left-color:var(--red)!important}
.cf-no{border-left-color:var(--dim)!important}
.t-word{font-size:20px;font-weight:bold;color:#e8e8e8;letter-spacing:.02em;line-height:1;white-space:nowrap}
.t-word-missing{font-size:16px;color:var(--red);letter-spacing:.04em;font-style:italic}
.t-speaker{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:130px;margin-top:3px;letter-spacing:.04em}
.t-date{font-size:8px;color:#3a3a3a;letter-spacing:.04em}
.t-actions{display:none;position:absolute;top:3px;right:3px;gap:2px;z-index:2}
.tile:hover .t-actions,.tile.selected .t-actions{display:flex}
.t-btn{background:rgba(11,11,11,.85);border:1px solid var(--border2);color:var(--muted);
  font-size:10px;width:18px;height:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;line-height:1;transition:color .1s,border-color .1s}
.t-btn:hover{color:var(--accent);border-color:var(--accent)}
.t-btn.on{color:var(--green);border-color:var(--green)}

/* automation lane */
#laneSection{display:none;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
#laneSection.visible{display:block}
#laneHeader{display:flex;align-items:center;gap:10px;
  padding:5px 12px 5px 28px;border-bottom:1px solid var(--border)}
.lane-label{font-size:8px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase}
.lane-btn{background:none;border:1px solid var(--border2);color:var(--muted);
  font-family:inherit;font-size:8px;padding:3px 9px;cursor:pointer;
  letter-spacing:.1em;text-transform:uppercase;transition:color .1s,border-color .1s}
.lane-btn:hover{color:var(--accent);border-color:var(--accent)}
.lane-hint{font-size:8px;color:#2e2e2e;margin-left:auto;letter-spacing:.04em}
#lane{width:100%;display:block;cursor:crosshair}

/* candidates panel */
#candPanel{display:none;border-top:1px solid var(--border);
  flex-direction:column;max-height:196px;flex-shrink:0}
#candPanel.open{display:flex}
#candHeader{display:flex;align-items:center;
  padding:7px 28px;border-bottom:1px solid var(--border);flex-shrink:0}
#candTitle{font-size:9px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.cand-close{background:none;border:none;color:var(--muted);font-size:14px;
  cursor:pointer;padding:0 2px;line-height:1;margin-left:auto}
.cand-close:hover{color:var(--text)}
#candList{overflow-y:auto;flex:1}
.cand-row{display:flex;align-items:center;gap:14px;
  padding:7px 28px;border-bottom:1px solid var(--border);
  font-size:10px;color:var(--muted);transition:background .1s}
.cand-row:hover{background:var(--surface)}
.cand-row.cur{color:var(--text)}
.cand-row.cur::before{content:'›';color:var(--accent);margin-right:-8px;flex-shrink:0}
.cand-conf{width:32px;text-align:right;flex-shrink:0;color:var(--text)}
.cand-speaker{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-date{width:60px;flex-shrink:0}
.cand-dur{width:40px;text-align:right;flex-shrink:0}
.cand-acts{display:flex;gap:4px;flex-shrink:0;margin-left:8px}
.cand-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);
  font-family:inherit;font-size:9px;padding:3px 9px;cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase;
  transition:color .1s,border-color .1s,background .1s}
.cand-btn:hover{color:var(--accent);border-color:var(--accent)}
.cand-btn.use:hover{color:#000;background:var(--accent);border-color:var(--accent)}
.cand-btn:disabled{opacity:.25;cursor:not-allowed;pointer-events:none}

/* player */
#playerBar{position:fixed;bottom:0;left:0;right:0;height:var(--player-h);
  background:var(--surface);border-top:1px solid var(--border2);
  display:flex;align-items:center;gap:14px;padding:0 28px;z-index:100}
#playBtn{background:none;border:1px solid var(--border2);color:var(--text);
  width:30px;height:30px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:border-color .12s,color .12s}
#playBtn:hover{border-color:var(--accent);color:var(--accent)}
.progress-wrap{flex:1;height:2px;background:var(--border2);cursor:pointer;position:relative}
.progress-wrap:hover{height:3px}
.progress-wrap:hover #progressHandle{opacity:1}
#progressFill{height:100%;width:0%;background:var(--accent);pointer-events:none}
#progressHandle{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;
  background:var(--accent);transform:translate(50%,-50%);
  opacity:0;pointer-events:none;transition:opacity .12s}
#timeDisplay{font-size:9px;color:var(--muted);letter-spacing:.06em;
  white-space:nowrap;flex-shrink:0;width:76px;text-align:right}
.dl-btn{font-size:9px;letter-spacing:.15em;flex-shrink:0;padding:6px 14px}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes shimmer{0%{opacity:.5}50%{opacity:.8}100%{opacity:.5}}
.busy #strip{animation:shimmer 1s ease-in-out infinite}
</style>
</head>
<body>

<header>
  <div class="logo">Mouthpiece</div>
  <div id="status">ready</div>
</header>

<div class="input-row">
  <input class="text-input" id="textInput" type="text"
         placeholder="type text to assemble…" autocomplete="off" spellcheck="false"/>
  <input class="seed-input" id="seedInput" type="number" placeholder="seed"/>
  <button class="btn primary" id="renderBtn" onclick="doRender()">Render</button>
</div>

<div id="infoBar">
  <div class="info-cell">seed&nbsp;<b id="iSeed">—</b></div>
  <div class="info-cell">duration&nbsp;<b id="iDur">—</b></div>
  <div class="info-cell">coverage&nbsp;<b id="iCov">—</b></div>
</div>

<div id="canvas">
  <div id="strip"><div class="empty-state">enter text above and press render</div></div>
</div>

<div id="laneSection">
  <div id="laneHeader">
    <span class="lane-label">Automation</span>
    <button class="lane-btn" onclick="normalizeSpeed()"
            title="Normalize speaking rate by chars/sec across clips">normalize speed</button>
    <button class="lane-btn" onclick="resetAllAdj()">reset all</button>
    <span class="lane-hint">drag dots · click to seek</span>
  </div>
  <svg id="lane" height="132"></svg>
</div>

<div id="candPanel">
  <div id="candHeader">
    <div id="candTitle">candidates</div>
    <button class="cand-close" onclick="closeCands()">×</button>
  </div>
  <div id="candList"></div>
</div>

<div id="playerBar">
  <button id="playBtn" onclick="togglePlay()">▶</button>
  <div class="progress-wrap" id="progressWrap">
    <div id="progressFill"></div>
    <div id="progressHandle"></div>
  </div>
  <span id="timeDisplay">—:—— / —:——</span>
  <button class="btn dl-btn" onclick="doDownload()">↓ wav</button>
  <button class="btn dl-btn" onclick="doReaperExport()" id="reaperBtn">↓ reaper</button>
</div>

<audio id="player" style="display:none"></audio>
<audio id="preview" style="display:none"></audio>

<script>
'use strict';

/* ── State ─────────────────────────────────────────────── */
const S = {
  render:      null,
  sel:         null,
  outputTimes: null,   // [{startT, endT}] computed from word durations
  activeWord:  -1,     // currently playing word index
};
const pendingAdj = {};
let drag = null;
let dragMoved = false;
let wasLastDrag = false;  // survives into the click event that fires after mouseup

/* ── DOM ────────────────────────────────────────────────── */
const player  = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
const fill    = document.getElementById('progressFill');
const handle  = document.getElementById('progressHandle');
const timeDis = document.getElementById('timeDisplay');
const lane    = document.getElementById('lane');

/* ── Player ─────────────────────────────────────────────── */
player.addEventListener('timeupdate', () => {
  if (!player.duration || isNaN(player.duration)) return;
  const pct = player.currentTime / player.duration * 100;
  fill.style.width   = pct + '%';
  handle.style.right = (100 - pct) + '%';
  timeDis.textContent = fmtTime(player.currentTime) + ' / ' + fmtTime(player.duration);
  updateCursor(player.currentTime);
});
player.addEventListener('play',  () => { playBtn.textContent = '⏸'; });
player.addEventListener('pause', () => { playBtn.textContent = '▶'; });
player.addEventListener('ended', () => {
  playBtn.textContent = '▶';
  fill.style.width = '0%';
  updateCursor(0);
});
player.addEventListener('loadedmetadata', () => {
  timeDis.textContent = '0:00 / ' + fmtTime(player.duration);
});

function togglePlay() {
  if (!S.render) return;
  player.paused ? player.play() : player.pause();
}

document.getElementById('progressWrap').addEventListener('click', e => {
  if (!player.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  player.currentTime = ((e.clientX - r.left) / r.width) * player.duration;
});

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
}

function loadAudio(id) {
  player.src = `/api/render/${id}/audio?t=${Date.now()}`;
  player.load();
  fill.style.width = '0%';
  timeDis.textContent = '0:00 / —:——';
  playBtn.textContent = '▶';
}

/* ── API ────────────────────────────────────────────────── */
async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({detail: r.statusText}));
    throw new Error(e.detail || r.statusText);
  }
  return r.json();
}

/* ── Lane geometry ──────────────────────────────────────── */
const L = {
  padL: 38, padR: 10, padT: 8, padB: 22,
  speedH: 42, gapH: 12, pitchH: 42,
  get h()   { return this.padT + this.speedH + this.gapH + this.pitchH + this.padB; },
  get yST() { return this.padT; },
  get ySB() { return this.padT + this.speedH; },
  get yPT() { return this.padT + this.speedH + this.gapH; },
  get yPB() { return this.padT + this.speedH + this.gapH + this.pitchH; },
};
const SPEED_MIN = 0.25, SPEED_MAX = 4.0;
const PITCH_MIN = -12,  PITCH_MAX = 12;

function speedToY(v) {
  const t = (SPEED_MAX - clamp(v, SPEED_MIN, SPEED_MAX)) / (SPEED_MAX - SPEED_MIN);
  return L.yST + 4 + t * (L.speedH - 8);
}
function yToSpeed(y) {
  const t = (y - L.yST - 4) / (L.speedH - 8);
  return clamp(SPEED_MAX - t * (SPEED_MAX - SPEED_MIN), SPEED_MIN, SPEED_MAX);
}
function pitchToY(v) {
  const t = (PITCH_MAX - clamp(v, PITCH_MIN, PITCH_MAX)) / (PITCH_MAX - PITCH_MIN);
  return L.yPT + 4 + t * (L.pitchH - 8);
}
function yToPitch(y) {
  const t = (y - L.yPT - 4) / (L.pitchH - 8);
  return clamp(PITCH_MAX - t * (PITCH_MAX - PITCH_MIN), PITCH_MIN, PITCH_MAX);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ── Output time estimation (client-side) ───────────────── */
// Mirrors the assembly constants; used for cursor positioning + click-to-seek.
// Approximate — ignores crossfade overlap (~25ms per junction).
const GAP_S = 0.10, MISSING_S = 0.40, CLIP_PAD = 0.04;

function computeOutputTimes(words) {
  let t = 0;
  return words.map((w, i) => {
    if (i > 0) t += GAP_S;
    const startT = t;
    if (!w.found) {
      t += MISSING_S;
    } else {
      const nat = w.duration_s || 0;
      const pad = Math.min(CLIP_PAD, Math.max(nat * 0.25, 0.010));
      t += (nat + 2 * pad) / Math.max(w.speed ?? 1, 0.1);
    }
    return {startT, endT: t};
  });
}

/* X position in lane from output time */
function timeToX(t, W) {
  const dur = S.render?.duration_s || 1;
  return L.padL + (t / dur) * (W - L.padL - L.padR);
}
/* X position at word center */
function wordCenterX(i, W) {
  if (!S.outputTimes?.[i]) return L.padL;
  const {startT, endT} = S.outputTimes[i];
  return timeToX((startT + endT) / 2, W);
}

/* ── Lane draw (full rebuild) ───────────────────────────── */
function buildLane() {
  if (!S.render?.words?.length) { lane.innerHTML = ''; return; }

  const W = lane.getBoundingClientRect().width;
  if (!W) { requestAnimationFrame(buildLane); return; }

  const words = S.render.words;
  const H     = L.h;
  lane.setAttribute('height', H);
  lane.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const trackW = W - L.padL - L.padR;
  const yS1    = speedToY(1.0);
  const yP0    = pitchToY(0.0);

  let o = '';

  // ── speed track ──────────────────────────────────────
  o += `<rect x="${L.padL}" y="${L.yST}" width="${trackW}" height="${L.speedH}"
    fill="rgba(255,255,255,.016)" rx="2"/>`;
  o += hline(L.padL, W - L.padR, yS1, '#232323', '4 5');
  o += yLbl(L.padL - 3, L.yST + 9,  '4×');
  o += yLbl(L.padL - 3, yS1 + 3,    '1×',  '#4a4a4a');
  o += yLbl(L.padL - 3, L.ySB - 2,  '¼×');
  o += trkLbl(L.padL + 3, L.yST + 9, 'SPEED');
  // polyline
  const sPts = words.map((w, i) =>
    `${wordCenterX(i, W).toFixed(1)},${speedToY(w.speed ?? 1).toFixed(1)}`).join(' ');
  o += `<polyline points="${sPts}" fill="none" stroke="#c4a84e"
    stroke-width="1.5" opacity="0.45" stroke-linejoin="round"/>`;

  // ── pitch track ───────────────────────────────────────
  o += `<rect x="${L.padL}" y="${L.yPT}" width="${trackW}" height="${L.pitchH}"
    fill="rgba(255,255,255,.016)" rx="2"/>`;
  o += hline(L.padL, W - L.padR, yP0, '#232323', '4 5');
  o += yLbl(L.padL - 3, L.yPT + 9,  '+12');
  o += yLbl(L.padL - 3, yP0 + 3,    '0',   '#4a4a4a');
  o += yLbl(L.padL - 3, L.yPB - 2,  '-12');
  o += trkLbl(L.padL + 3, L.yPT + 9, 'PITCH');
  const pPts = words.map((w, i) =>
    `${wordCenterX(i, W).toFixed(1)},${pitchToY(w.pitch ?? 0).toFixed(1)}`).join(' ');
  o += `<polyline points="${pPts}" fill="none" stroke="#6a7fc4"
    stroke-width="1.5" opacity="0.45" stroke-linejoin="round"/>`;

  // ── selected word vertical rule ───────────────────────
  if (S.sel !== null && S.outputTimes?.[S.sel]) {
    const sx = wordCenterX(S.sel, W);
    o += `<line x1="${sx}" y1="${L.padT}" x2="${sx}" y2="${L.yPB}"
      stroke="#c4a84e" opacity="0.18" stroke-width="1"/>`;
  }

  // ── dots + labels (one per word) ──────────────────────
  words.forEach((w, i) => {
    const x    = wordCenterX(i, W);
    const sy   = speedToY(w.speed ?? 1);
    const py   = pitchToY(w.pitch ?? 0);
    const sel  = S.sel === i;
    const play = S.activeWord === i;
    const adjS = Math.abs((w.speed ?? 1) - 1) >= 0.02;
    const adjP = Math.abs(w.pitch ?? 0) >= 0.05;

    // speed dot
    o += svgDot(x, sy, 'speed', i, sel,
      adjS ? '#c4a84e' : (play ? '#5a4a20' : '#272727'),
      sel || adjS ? '#c4a84e' : (play ? '#8a7040' : '#3a3a3a'));
    // pitch dot
    o += svgDot(x, py, 'pitch', i, sel,
      adjP ? '#6a7fc4' : (play ? '#2a3060' : '#272727'),
      sel || adjP ? '#6a7fc4' : (play ? '#5060a0' : '#3a3a3a'));

    // word label — clickable for seek+select
    const labelFill = play ? '#c4a84e' : (sel ? '#888' : (!w.found ? '#5a2a2a' : '#363636'));
    const labelW    = truncate(w.token, 8);
    o += `<text id="laneWord${i}" x="${x.toFixed(1)}" y="${L.yPB + 14}"
      text-anchor="middle" fill="${labelFill}" font-size="7.5" font-family="monospace"
      style="cursor:pointer" data-seek-idx="${i}">${esc(labelW)}</text>`;
  });

  // ── playback cursor (drawn last → on top) ────────────
  const cxInit = S.render
    ? timeToX(player.currentTime || 0, W).toFixed(1)
    : (L.padL).toString();
  o += `<line id="laneCursor"
    x1="${cxInit}" y1="${L.padT - 2}"
    x2="${cxInit}" y2="${L.yPB + 2}"
    stroke="rgba(255,255,255,0.55)" stroke-width="1"
    style="pointer-events:none"/>`;

  lane.setAttribute('height', H);
  lane.innerHTML = o;
}

function hline(x1, x2, y, stroke, dash) {
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"
    stroke="${stroke}" stroke-dasharray="${dash}"/>`;
}
function yLbl(x, y, t, color='#313131') {
  return `<text x="${x}" y="${y}" text-anchor="end"
    fill="${color}" font-size="7" font-family="monospace">${t}</text>`;
}
function trkLbl(x, y, t) {
  return `<text x="${x}" y="${y}" fill="#272727"
    font-size="7" font-family="monospace" letter-spacing="2">${t}</text>`;
}
function svgDot(x, y, track, word, sel, fillCol, strokeCol) {
  const r = sel ? 6 : 4.5;
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"
    fill="${fillCol}" stroke="${strokeCol}" stroke-width="${sel ? 2 : 1}"
    data-track="${track}" data-word="${word}"
    style="cursor:ns-resize"/>`;
}

/* ── Cursor update (called on timeupdate — no full rebuild) */
function updateCursor(t) {
  if (!S.render || !S.outputTimes) return;
  const cursorEl = document.getElementById('laneCursor');
  if (!cursorEl) return;

  const W = lane.getBoundingClientRect().width;
  if (!W) return;
  const dur = S.render.duration_s;
  if (!dur) return;

  const x = timeToX(t, W).toFixed(1);
  cursorEl.setAttribute('x1', x);
  cursorEl.setAttribute('x2', x);

  // find which word is currently playing
  let activeIdx = -1;
  for (let i = 0; i < S.outputTimes.length; i++) {
    const next = S.outputTimes[i + 1]?.startT ?? dur;
    if (t >= S.outputTimes[i].startT && t < next) { activeIdx = i; break; }
  }

  if (activeIdx !== S.activeWord) {
    // deactivate previous
    if (S.activeWord >= 0) {
      document.getElementById(`laneWord${S.activeWord}`)
        ?.setAttribute('fill', getLabelFill(S.activeWord));
      document.querySelector(`.tile[data-i="${S.activeWord}"]`)
        ?.classList.remove('t-playing');
    }
    // activate new
    if (activeIdx >= 0) {
      document.getElementById(`laneWord${activeIdx}`)
        ?.setAttribute('fill', '#c4a84e');
      document.querySelector(`.tile[data-i="${activeIdx}"]`)
        ?.classList.add('t-playing');
    }
    S.activeWord = activeIdx;
  }
}

function getLabelFill(i) {
  if (!S.render) return '#363636';
  const w = S.render.words[i];
  return S.sel === i ? '#888' : (!w?.found ? '#5a2a2a' : '#363636');
}

new ResizeObserver(buildLane).observe(lane);

/* ── Lane interactions ──────────────────────────────────── */

// drag on speed/pitch dots
lane.addEventListener('mousedown', e => {
  const el = e.target.closest('[data-track]');
  if (!el || !S.render) return;
  drag = {track: el.dataset.track, word: +el.dataset.word};
  dragMoved = false;
  if (S.sel !== drag.word) {
    if (S.sel !== null) tileDesel(S.sel);
    S.sel = drag.word;
    tileSel(S.sel);
  }
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!drag || !S.render) return;
  dragMoved = true;
  const rect = lane.getBoundingClientRect();
  const y    = e.clientY - rect.top;
  const w    = S.render.words[drag.word];
  if (!w) return;
  if (drag.track === 'speed') w.speed = +yToSpeed(y).toFixed(3);
  else                         w.pitch = +yToPitch(y).toFixed(2);
  pendingAdj[drag.word] = {speed: w.speed ?? 1, pitch: w.pitch ?? 0};
  buildLane();
});

window.addEventListener('mouseup', async () => {
  if (!drag) return;
  wasLastDrag = dragMoved;   // set BEFORE resetting dragMoved; click fires after this
  drag = null;
  dragMoved = false;
  if (wasLastDrag) await flushAdj();
});

// click on lane: seek if not a drag, or click a word label
lane.addEventListener('click', e => {
  if (wasLastDrag) { wasLastDrag = false; return; }  // drag just ended, ignore click

  // word label clicked → seek + select
  const lbl = e.target.closest('[data-seek-idx]');
  if (lbl) {
    const i = +lbl.dataset.seekIdx;
    if (S.outputTimes?.[i] != null) player.currentTime = S.outputTimes[i].startT;
    if (S.sel !== i) selectWord(i);
    return;
  }

  // background click → seek to that time
  if (!S.render?.duration_s) return;
  const rect = lane.getBoundingClientRect();
  const frac = (e.clientX - rect.left - L.padL) / (rect.width - L.padL - L.padR);
  if (frac >= 0 && frac <= 1) player.currentTime = frac * S.render.duration_s;
});

// touch drag
lane.addEventListener('touchstart', e => {
  const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY)
               ?.closest('[data-track]');
  if (!el || !S.render) return;
  drag = {track: el.dataset.track, word: +el.dataset.word};
  dragMoved = false;
  e.preventDefault();
}, {passive: false});

window.addEventListener('touchmove', e => {
  if (!drag || !S.render) return;
  dragMoved = true;
  const rect = lane.getBoundingClientRect();
  const y    = e.touches[0].clientY - rect.top;
  const w    = S.render.words[drag.word];
  if (!w) return;
  if (drag.track === 'speed') w.speed = +yToSpeed(y).toFixed(3);
  else                         w.pitch = +yToPitch(y).toFixed(2);
  pendingAdj[drag.word] = {speed: w.speed ?? 1, pitch: w.pitch ?? 0};
  buildLane();
}, {passive: true});

window.addEventListener('touchend', async () => {
  if (!drag) return;
  wasLastDrag = dragMoved;
  drag = null;
  dragMoved = false;
  if (wasLastDrag) await flushAdj();
});

async function flushAdj() {
  if (!S.render || !Object.keys(pendingAdj).length) return;
  const adjustments = Object.entries(pendingAdj).map(([i, v]) => ({
    word_index: +i, speed: v.speed, pitch: v.pitch,
  }));
  Object.keys(pendingAdj).forEach(k => delete pendingAdj[k]);
  setStatus('applying…');
  try {
    const render = await api('POST', `/api/render/${S.render.id}/adjust_batch`, {adjustments});
    applyRender(render, S.sel);
    setStatus('done');
  } catch(e) { setStatus('error: ' + e.message); }
}

/* ── Normalization ──────────────────────────────────────── */
function normalizeSpeed() {
  if (!S.render) return;
  const found = S.render.words.filter(w => w.found && (w.duration_s || 0) > 0);
  if (!found.length) return;
  const rates  = found.map(w => w.token.length / w.duration_s);
  const sorted = [...rates].sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];
  S.render.words.forEach(w => {
    if (!w.found || !w.duration_s) return;
    w.speed = +clamp(w.token.length / w.duration_s / median, 0.5, 2.0).toFixed(3);
    pendingAdj[w.index] = {speed: w.speed, pitch: w.pitch ?? 0};
  });
  S.outputTimes = computeOutputTimes(S.render.words);
  buildLane();
  flushAdj();
}

function resetAllAdj() {
  if (!S.render) return;
  S.render.words.forEach(w => {
    w.speed = 1.0; w.pitch = 0.0;
    pendingAdj[w.index] = {speed: 1.0, pitch: 0.0};
  });
  S.outputTimes = computeOutputTimes(S.render.words);
  buildLane();
  flushAdj();
}

/* ── Actions ────────────────────────────────────────────── */
async function doRender() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;
  const sv = document.getElementById('seedInput').value;
  const body = {text};
  if (sv) body.seed = parseInt(sv, 10);
  setStatus('rendering…');
  setBusy(true);
  try {
    applyRender(await api('POST', '/api/render', body));
    setStatus('done');
  } catch(e) { setStatus('error: ' + e.message); }
  setBusy(false);
}

async function doReroll(i, ev) {
  ev.stopPropagation();
  if (S.render.words[i]?.locked) return;
  setStatus('rerolling…');
  try {
    const render = await api('POST', `/api/render/${S.render.id}/reroll/${i}`);
    applyRender(render, i);
    if (S.sel === i) await refreshCands(i, render.words[i]);
    setStatus('done');
  } catch(e) { setStatus('error: ' + e.message); }
}

async function doSwap(i, instanceId) {
  setStatus('swapping…');
  try {
    const render = await api('POST', `/api/render/${S.render.id}/swap/${i}`, {word_instance_id: instanceId});
    applyRender(render, i);
    if (S.sel === i) await refreshCands(i, render.words[i]);
    setStatus('done');
  } catch(e) { setStatus('error: ' + e.message); }
}

async function doLock(i, ev) {
  ev.stopPropagation();
  const next = !S.render.words[i]?.locked;
  try {
    await api('POST', `/api/render/${S.render.id}/lock/${i}`, {locked: next});
    S.render.words[i].locked = next;
    updateTile(i);
  } catch(e) { setStatus('error: ' + e.message); }
}

async function selectWord(i) {
  const alreadyOpen = document.getElementById('candPanel').classList.contains('open');
  if (S.sel === i && alreadyOpen) { closeCands(); return; }
  if (S.sel !== null) tileDesel(S.sel);
  S.sel = i;
  tileSel(i);
  buildLane();

  const w = S.render.words[i];
  if (!w?.found) return;

  document.getElementById('candTitle').textContent = `candidates — "${w.token}"`;
  document.getElementById('candPanel').classList.add('open');
  setStatus('loading candidates…');
  await refreshCands(i, w);
}

async function refreshCands(i, w) {
  try {
    const cands = await api('GET', `/api/candidates/${encodeURIComponent(w.token)}`);
    buildCandList(w, i, cands);
    setStatus(`${cands.length} candidates for "${w.token}"`);
  } catch(e) { setStatus('error: ' + e.message); }
}

function doPreview(id) {
  const a = document.getElementById('preview');
  a.src = `/api/clip/${id}/preview?t=${Date.now()}`;
  a.play();
}
function doDownload() {
  if (S.render) window.location.href = `/api/render/${S.render.id}/download`;
}

function doReaperExport() {
  if (S.render) window.location.href = `/api/render/${S.render.id}/reaper`;
}

/* ── Render state ───────────────────────────────────────── */
function applyRender(render, keepSel) {
  S.render     = render;
  S.activeWord = -1;
  if (keepSel === undefined) { S.sel = null; closeCands(); }

  S.outputTimes = computeOutputTimes(render.words);

  document.getElementById('seedInput').value   = render.seed;
  document.getElementById('iSeed').textContent = render.seed;
  document.getElementById('iDur').textContent  = render.duration_s.toFixed(2) + 's';
  const found = render.words.filter(w => w.found).length;
  document.getElementById('iCov').textContent  = `${found}/${render.words.length}`;
  document.getElementById('infoBar').classList.add('visible');
  document.getElementById('laneSection').classList.add('visible');

  loadAudio(render.id);
  buildStrip(render.words);
  buildLane();
  if (S.sel !== null) tileSel(S.sel);
}

/* ── Word strip ─────────────────────────────────────────── */
function cfClass(c) {
  if (c == null) return 'cf-no';
  if (c >= 0.75) return 'cf-hi';
  if (c >= 0.45) return 'cf-md';
  return 'cf-lo';
}
function tiltDeg(w) {
  const id = w.word_instance_id ?? 0;
  return (((id * 37 + 13) % 13) - 6) * 0.3;
}
function isAdj(w) {
  return Math.abs((w.speed ?? 1) - 1) >= 0.02 || Math.abs(w.pitch ?? 0) >= 0.05;
}

function makeTile(w, i) {
  const d = document.createElement('div');
  d.className = ['tile',
    !w.found ? 'missing' : '',
    w.locked  ? 't-locked' : '',
    isAdj(w)  ? 't-adj' : '',
    w.found   ? cfClass(w.confidence) : '',
  ].filter(Boolean).join(' ');
  d.dataset.i = i;
  d.style.setProperty('--tilt', tiltDeg(w) + 'deg');
  d.onclick = () => selectWord(i);

  if (w.found) {
    d.innerHTML = `
      <div class="t-word">${esc(w.token)}</div>
      <div class="t-speaker">${esc(truncate(w.speaker || '—', 18))}</div>
      <div class="t-date">${esc(w.date || '—')}</div>
      <div class="t-actions">
        <button class="t-btn${w.locked?' on':''}" onclick="doLock(${i},event)">◈</button>
        <button class="t-btn" onclick="doReroll(${i},event)">↻</button>
      </div>`;
  } else {
    d.innerHTML = `
      <div class="t-word-missing">${esc(w.token)}</div>
      <div class="t-date">missing</div>`;
  }
  return d;
}

function buildStrip(words) {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  words.forEach((w, i) => strip.appendChild(makeTile(w, i)));
}

function updateTile(i) {
  const old = document.querySelector(`.tile[data-i="${i}"]`);
  if (!old) return;
  const fresh = makeTile(S.render.words[i], i);
  if (S.sel === i) fresh.classList.add('selected');
  old.replaceWith(fresh);
}

function tileSel(i) {
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
  document.querySelector(`.tile[data-i="${i}"]`)?.classList.add('selected');
}
function tileDesel(i) {
  document.querySelector(`.tile[data-i="${i}"]`)?.classList.remove('selected');
}

/* ── Candidates ─────────────────────────────────────────── */
function buildCandList(w, i, cands) {
  const list = document.getElementById('candList');
  list.innerHTML = '';
  if (!cands.length) {
    list.innerHTML = '<div class="cand-row" style="color:var(--muted)">no candidates found</div>';
    return;
  }
  cands.forEach(c => {
    const cur  = c.id === w.word_instance_id;
    const conf = c.confidence != null ? Math.round(c.confidence * 100) + '%' : '—';
    const row  = document.createElement('div');
    row.className = 'cand-row' + (cur ? ' cur' : '');
    row.innerHTML = `
      <span class="cand-conf">${conf}</span>
      <span class="cand-speaker">${esc(c.speaker||'—')}</span>
      <span class="cand-date">${esc(c.date||'—')}</span>
      <span class="cand-dur">${c.duration_s}s</span>
      <div class="cand-acts">
        <button class="cand-btn" onclick="doPreview(${c.id})">▶</button>
        ${cur
          ? '<button class="cand-btn" disabled>current</button>'
          : `<button class="cand-btn use" onclick="doSwap(${i},${c.id})">use</button>`}
      </div>`;
    list.appendChild(row);
  });
}

function closeCands() {
  document.getElementById('candPanel').classList.remove('open');
  if (S.sel !== null) { tileDesel(S.sel); S.sel = null; buildLane(); }
}

/* ── Util ───────────────────────────────────────────────── */
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setBusy(on) {
  document.getElementById('renderBtn').disabled = on;
  document.getElementById('canvas').classList.toggle('busy', on);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncate(s, n) { return s.length > n ? s.slice(0, n-1) + '…' : s; }

document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRender();
});
</script>
</body>
